<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ponza Digitale Site Builder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --primary: #1a4b75; --accent: #4fa4d8; --bg: #f5f5f5; --card: #fff; --danger: #e05c3a; --success: #27ae60; --warn: #f39c12; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; }

.login-screen, .admin-screen { max-width: 1000px; margin: 0 auto; padding: 20px; }

/* Login */
.login-box { max-width: 360px; margin: 100px auto; background: var(--card); padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
.login-box h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 24px; }
.login-box input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; outline: none; }
.login-box input:focus { border-color: var(--accent); }
.login-box button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
.login-box button:hover { background: var(--primary); }

/* Admin */
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 0; border-bottom: 2px solid var(--accent); }
.admin-header h1 { color: var(--primary); font-size: 1.4rem; }
.admin-header button { padding: 8px 16px; background: transparent; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

.stats { display: flex; gap: 16px; margin-bottom: 24px; }
.stat-card { flex:1; background: var(--card); padding: 16px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.stat-card .num { font-size: 2rem; font-weight: 700; }
.stat-card.pending .num { color: var(--warn); }
.stat-card.published .num { color: var(--success); }
.stat-card.total .num { color: var(--primary); }
.stat-card .lbl { font-size: 0.85rem; color: #888; }

.site-list { display: flex; flex-direction: column; gap: 12px; }
.site-card { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 16px; }
.site-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.site-status.pending { background: var(--warn); }
.site-status.published { background: var(--success); }
.site-info { flex: 1; }
.site-name { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
.site-meta { font-size: 0.85rem; color: #888; margin-top: 2px; }
.site-sub { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
.site-actions { display: flex; gap: 8px; }
.btn-sm { padding: 8px 14px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn-sm:hover { opacity: 0.8; }
.btn-preview { background: #eee; color: #555; }
.btn-approve { background: var(--success); color: #fff; }
.btn-delete { background: var(--danger); color: #fff; }
.btn-url { background: var(--accent); color: #fff; text-decoration: none; display: inline-block; }

.empty { text-align: center; padding: 60px; color: #aaa; }
.empty i { font-size: 48px; margin-bottom: 12px; display: block; }

.hidden { display: none; }

/* Modal */
.modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--card); border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; }
.modal h3 { margin-bottom: 12px; color: var(--primary); }
.modal-details { font-size: 0.9rem; line-height: 1.8; }
.modal-details strong { color: var(--primary); }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

@media (max-width: 600px) {
    .stats { flex-direction: column; }
    .site-card { flex-direction: column; align-items: flex-start; }
    .site-actions { width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1><i class="fas fa-lock"></i> Admin Panel</h1>
        <p style="margin-bottom:20px;color:#888;font-size:0.9rem;">Ponza Digitale Site Builder</p>
        <input type="password" id="passwordInput" placeholder="Password admin..." autofocus>
        <button id="loginBtn">Accedi</button>
        <p id="loginError" style="color:var(--danger);margin-top:12px;font-size:0.85rem;" class="hidden"></p>
    </div>
</div>

<!-- ADMIN -->
<div class="admin-screen hidden" id="adminScreen">
    <div class="admin-header">
        <h1><i class="fas fa-magic"></i> Ponza Digitale — Admin</h1>
        <div>
            <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Aggiorna</button>
            <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Esci</button>
        </div>
    </div>

    <div class="stats" id="statsBar">
        <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="lbl">In attesa</div></div>
        <div class="stat-card published"><div class="num" id="statPublished">0</div><div class="lbl">Pubblicati</div></div>
        <div class="stat-card total"><div class="num" id="statTotal">0</div><div class="lbl">Totale</div></div>
    </div>

    <div class="site-list" id="siteList"></div>
</div>

<script>
const API_BASE = window.location.origin;
let token = '';
let sites = [];

// ─── LOGIN ───

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
    token = document.getElementById('passwordInput').value.trim();
    if (!token) return;
    try {
        const res = await fetch(`${API_BASE}/api/admin/sites`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) {
            document.getElementById('loginError').textContent = 'Password errata';
            document.getElementById('loginError').classList.remove('hidden');
            return;
        }
        sites = await res.json();
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminScreen').classList.remove('hidden');
        renderSites();
    } catch (err) {
        document.getElementById('loginError').textContent = 'Errore di connessione';
        document.getElementById('loginError').classList.remove('hidden');
    }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
    token = '';
    document.getElementById('adminScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
});

document.getElementById('refreshBtn').addEventListener('click', loadSites);

async function loadSites() {
    try {
        const res = await fetch(`${API_BASE}/api/admin/sites`, { headers: { Authorization: `Bearer ${token}` } });
        sites = await res.json();
        renderSites();
    } catch (err) { alert('Errore caricamento'); }
}

// ─── RENDER ───

function renderSites() {
    const pending = sites.filter(s => s.status === 'pending').length;
    const published = sites.filter(s => s.status === 'published').length;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statPublished').textContent = published;
    document.getElementById('statTotal').textContent = sites.length;

    const list = document.getElementById('siteList');
    if (sites.length === 0) {
        list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>Nessun sito ricevuto</p></div>';
        return;
    }

    list.innerHTML = sites.map(site => {
        const date = new Date(site.created_at).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const isPublished = site.status === 'published';
        return `
        <div class="site-card">
            <div class="site-status ${site.status}"></div>
            <div class="site-info">
                <div class="site-name">${site.nome}</div>
                <div class="site-sub">${site.sottodominio}.ponza.online</div>
                <div class="site-meta">${site.tipo_label || site.tipo} &bull; ${date} &bull; <span style="color:${isPublished ? 'var(--success)' : 'var(--warn)'}">${isPublished ? 'Pubblicato' : 'In attesa'}</span></div>
            </div>
            <div class="site-actions">
                <button class="btn-sm btn-preview" onclick="showDetails(${site.id})"><i class="fas fa-eye"></i> Dettagli</button>
                <a class="btn-sm btn-preview" href="${API_BASE}/api/admin/sites/${site.id}/preview?token=${encodeURIComponent(token)}" target="_blank"><i class="fas fa-external-link-alt"></i> Preview</a>
                ${isPublished
                    ? `<a class="btn-sm btn-url" href="${site.site_url}" target="_blank"><i class="fas fa-globe"></i> Vai al sito</a>`
                    : `<button class="btn-sm btn-approve" onclick="approveSite(${site.id})"><i class="fas fa-check"></i> Approva</button>`
                }
                <button class="btn-sm btn-delete" onclick="deleteSite(${site.id})"><i class="fas fa-trash"></i></button>
            </div>
        </div>`;
    }).join('');
}

// ─── ACTIONS ───

function showDetails(id) {
    const site = sites.find(s => s.id === id);
    if (!site) return;
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal">
            <h3><i class="fas fa-store"></i> ${site.nome}</h3>
            <div class="modal-details">
                <strong>Tipo:</strong> ${site.tipo_label || '-'}<br>
                <strong>Sottodominio:</strong> ${site.sottodominio}.ponza.online<br>
                <strong>Palette:</strong> ${site.palette_key || '-'}<br>
                <strong>Layout:</strong> ${site.layout_key || '-'}<br>
                <strong>Indirizzo:</strong> ${site.indirizzo || '-'}<br>
                <strong>Telefono:</strong> ${site.telefono || '-'}<br>
                <strong>Orari:</strong> ${site.orari || '-'}<br>
                <strong>Servizi:</strong> ${site.servizi || '-'}<br>
                <strong>Descrizione:</strong> ${site.descrizione || '-'}<br>
                <strong>Stato:</strong> ${site.status}
                ${site.site_url ? `<br><strong>URL:</strong> <a href="${site.site_url}" target="_blank">${site.site_url}</a>` : ''}
            </div>
            <div class="modal-actions">
                <button class="btn-sm btn-preview" onclick="this.closest('.modal-overlay').remove()">Chiudi</button>
                ${site.status !== 'published' ? `<button class="btn-sm btn-approve" onclick="this.closest('.modal-overlay').remove();approveSite(${site.id})">Approva e Pubblica</button>` : ''}
            </div>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

async function approveSite(id) {
    if (!confirm('Confermi la pubblicazione di questo sito?')) return;
    try {
        const res = await fetch(`${API_BASE}/api/admin/sites/${id}/approve`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            alert('Sito pubblicato con successo!\n\n' + data.url);
            loadSites();
        } else {
            alert('Errore: ' + (data.error || 'sconosciuto'));
        }
    } catch (err) { alert('Errore di rete'); }
}

async function deleteSite(id) {
    if (!confirm('Sei sicuro di voler eliminare questo sito?')) return;
    try {
        await fetch(`${API_BASE}/api/admin/sites/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
        });
        loadSites();
    } catch (err) { alert('Errore'); }
}
</script>
</body>
</html>
